version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jansetu-backend
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env.example
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - HOST=0.0.0.0
      - BIGQUERY_USE_MOCK=true
      - PUBSUB_USE_MOCK=true
      - GCS_USE_MOCK=true
      - FIREBASE_MOCK_AUTH=true
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: jansetu-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
